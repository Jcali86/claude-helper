<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Simulated Claude Code screen</title>
  <desc id="desc">A stylized app window showing Claude Code helping with a project in a folder.</desc>
  <rect width="1200" height="840" fill="#f4efe7"/>
  <rect x="86" y="56" width="1028" height="732" rx="30" fill="#fffdfa" stroke="#d8cfbf" stroke-width="2"/>
  <rect x="86" y="56" width="1028" height="72" rx="30" fill="#f8f3ea"/>
  <circle cx="138" cy="94" r="10" fill="#e5bc86"/>
  <circle cx="170" cy="94" r="10" fill="#d8d9bc"/>
  <circle cx="202" cy="94" r="10" fill="#bad8c7"/>
  <text x="266" y="104" font-family="Georgia, serif" font-size="30" fill="#1d2528">Claude Code Example</text>
  <rect x="118" y="150" width="252" height="602" rx="22" fill="#fcf8f0" stroke="#e5dbc9" stroke-width="2"/>
  <text x="146" y="196" font-family="Georgia, serif" font-size="30" fill="#0f493b">Project</text>
  <text x="146" y="244" font-family="Georgia, serif" font-size="24" fill="#5a6870">positive-news-digest/</text>
  <text x="162" y="286" font-family="Georgia, serif" font-size="23" fill="#5a6870">app.py</text>
  <text x="162" y="320" font-family="Georgia, serif" font-size="23" fill="#5a6870">data/sources.json</text>
  <text x="162" y="354" font-family="Georgia, serif" font-size="23" fill="#5a6870">Dockerfile</text>
  <text x="162" y="388" font-family="Georgia, serif" font-size="23" fill="#5a6870">README.md</text>
  <rect x="412" y="166" width="658" height="130" rx="22" fill="#12352c"/>
  <text x="442" y="218" font-family="Georgia, serif" font-size="28" fill="#f7fffc">I am new to Terminal and coding projects.</text>
  <text x="442" y="254" font-family="Georgia, serif" font-size="28" fill="#f7fffc">Please explain every step in plain language.</text>
  <rect x="412" y="328" width="658" height="170" rx="22" fill="#f4ecdf" stroke="#e3d8c0" stroke-width="2"/>
  <text x="442" y="378" font-family="Georgia, serif" font-size="27" fill="#1d2528">Perfect. I will explain what each command does before</text>
  <text x="442" y="414" font-family="Georgia, serif" font-size="27" fill="#1d2528">we use it. We can begin with a small project folder,</text>
  <text x="442" y="450" font-family="Georgia, serif" font-size="27" fill="#1d2528">then build a tiny app, then test it locally.</text>
  <rect x="412" y="536" width="658" height="164" rx="22" fill="#20282c"/>
  <text x="442" y="586" font-family="Courier New, monospace" font-size="26" fill="#eff4f6">python3 app.py</text>
  <text x="442" y="624" font-family="Courier New, monospace" font-size="26" fill="#eff4f6">Server running at http://localhost:8000</text>
  <text x="442" y="662" font-family="Courier New, monospace" font-size="26" fill="#8ee0b8">Generated digest with 4 positive stories</text>
</svg>
