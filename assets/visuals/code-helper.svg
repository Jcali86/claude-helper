<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1236 758" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code beginner example</title>
  <desc id="desc">A screenshot-style mockup of Claude desktop with Code selected and a beginner coding prompt.</desc>
  <rect width="1236" height="758" fill="#252320"/>
  <rect x="0" y="0" width="244" height="758" fill="#2b2926"/>
  <line x1="244" y1="0" x2="244" y2="758" stroke="#3a3733"/>
  <text x="36" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d8d2cb">New chat</text>
  <text x="36" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d8d2cb">Search</text>
  <text x="36" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d8d2cb">Customize</text>
  <text x="36" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d8d2cb">Chats</text>
  <text x="36" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d8d2cb">Projects</text>
  <text x="36" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d8d2cb">Artifacts</text>
  <rect x="14" y="726" width="36" height="36" rx="18" fill="#d7d0c7"/>
  <text x="28" y="749" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2b2926">J</text>
  <text x="58" y="742" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#d8d2cb">Jules</text>
  <text x="58" y="758" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#a8a29c">Max plan</text>
  <rect x="538" y="8" width="160" height="34" rx="16" fill="#1f1d1b" stroke="#36322f"/>
  <rect x="647" y="10" width="46" height="30" rx="15" fill="#2d2a27"/>
  <text x="558" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a6a09a">Chat</text>
  <text x="611" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a6a09a">Cowork</text>
  <text x="657" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff">Code</text>
  <text x="612" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#d07d5a">*</text>
  <text x="626" y="186" font-family="Georgia, serif" font-size="52" fill="#d7d0c7">Evening, Jules</text>
  <rect x="380" y="220" width="724" height="118" rx="18" fill="#34312e" stroke="#4a4642"/>
  <text x="402" y="254" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f3ede7">I am new to Terminal and coding projects, so please explain every</text>
  <text x="402" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f3ede7">step in plain English before we do it. Help me build a very simple</text>
  <text x="402" y="306" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f3ede7">app that pulls in positive local news and shows me a clean summary.</text>
  <text x="946" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aca59d">Sonnet 4.6 Extended</text>
  <rect x="1059" y="296" width="32" height="32" rx="8" fill="#d07d5a"/>
  <text x="1070" y="317" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff8f4">↑</text>
  <rect x="380" y="376" width="260" height="254" rx="18" fill="#2c2926" stroke="#44403c"/>
  <text x="402" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8f8a84">Project files</text>
  <text x="402" y="446" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1ebe3">positive-news-digest/</text>
  <text x="420" y="478" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cfc8c0">app.py</text>
  <text x="420" y="506" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cfc8c0">data/sources.json</text>
  <text x="420" y="534" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cfc8c0">templates/index.html</text>
  <text x="420" y="562" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cfc8c0">Dockerfile</text>
  <rect x="664" y="376" width="440" height="110" rx="18" fill="#302d2a" stroke="#44403c"/>
  <text x="686" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8f8a84">Claude reply</text>
  <text x="686" y="438" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1ebe3">Perfect. I’ll explain every command before we use it.</text>
  <text x="686" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d8d2cb">We’ll build this in small, safe steps.</text>
  <rect x="664" y="506" width="440" height="124" rx="18" fill="#1f2427" stroke="#394046"/>
  <text x="686" y="540" font-family="Courier New, monospace" font-size="16" fill="#edf3f5">python3 app.py</text>
  <text x="686" y="572" font-family="Courier New, monospace" font-size="15" fill="#edf3f5">Positive Local News Digest running at</text>
  <text x="686" y="596" font-family="Courier New, monospace" font-size="15" fill="#8fe0b8">http://127.0.0.1:8000</text>
</svg>
