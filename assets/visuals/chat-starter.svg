<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Simulated Claude Chat screen</title>
  <desc id="desc">A stylized app window showing a beginner-friendly Claude Chat conversation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="100%" stop-color="#e2f6ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <rect x="110" y="70" width="980" height="700" rx="28" fill="#fffdf8" stroke="#d9cfbe" stroke-width="2"/>
  <rect x="110" y="70" width="980" height="68" rx="28" fill="#f8f2e8"/>
  <circle cx="158" cy="104" r="10" fill="#e7bf81"/>
  <circle cx="190" cy="104" r="10" fill="#d8d8b7"/>
  <circle cx="222" cy="104" r="10" fill="#b8d8c4"/>
  <text x="280" y="112" font-family="Georgia, serif" font-size="30" fill="#1b2328">Claude Chat Example</text>
  <text x="170" y="188" font-family="Georgia, serif" font-size="22" fill="#56636c">You</text>
  <rect x="170" y="206" width="790" height="105" rx="22" fill="#12352c"/>
  <text x="200" y="250" font-family="Georgia, serif" font-size="29" fill="#f7fffc">I am new to AI and new to using a Mac outside a browser.</text>
  <text x="200" y="286" font-family="Georgia, serif" font-size="29" fill="#f7fffc">Please explain things simply.</text>
  <text x="170" y="380" font-family="Georgia, serif" font-size="22" fill="#56636c">Claude</text>
  <rect x="170" y="398" width="810" height="158" rx="22" fill="#f4ecdf" stroke="#e4d8bf" stroke-width="2"/>
  <text x="200" y="446" font-family="Georgia, serif" font-size="28" fill="#1b2328">Absolutely. I will keep things practical and low-stress.</text>
  <text x="200" y="484" font-family="Georgia, serif" font-size="28" fill="#1b2328">Claude can help you learn, plan, write, organize, and build</text>
  <text x="200" y="522" font-family="Georgia, serif" font-size="28" fill="#1b2328">small projects one step at a time.</text>
  <rect x="170" y="588" width="810" height="112" rx="22" fill="#f4ecdf" stroke="#e4d8bf" stroke-width="2"/>
  <text x="200" y="636" font-family="Georgia, serif" font-size="28" fill="#1b2328">A good place to start is: Chat for questions, Cowork for</text>
  <text x="200" y="674" font-family="Georgia, serif" font-size="28" fill="#1b2328">bigger guided tasks, and Code for real project folders.</text>
</svg>
