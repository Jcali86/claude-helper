<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Simulated Claude Cowork screen</title>
  <desc id="desc">A stylized app window showing a Claude Cowork planning session.</desc>
  <rect width="1200" height="840" fill="#f6efe4"/>
  <rect x="94" y="62" width="1012" height="720" rx="30" fill="#fffdf9" stroke="#d8cebf" stroke-width="2"/>
  <rect x="94" y="62" width="1012" height="72" rx="30" fill="#eef7f1"/>
  <circle cx="146" cy="98" r="10" fill="#d5c58d"/>
  <circle cx="178" cy="98" r="10" fill="#bad8c7"/>
  <circle cx="210" cy="98" r="10" fill="#d5d5bd"/>
  <text x="272" y="108" font-family="Georgia, serif" font-size="30" fill="#1c2528">Claude Cowork Example</text>
  <rect x="142" y="174" width="400" height="530" rx="24" fill="#faf5eb" stroke="#e4dac8" stroke-width="2"/>
  <text x="174" y="220" font-family="Georgia, serif" font-size="34" fill="#124b3d">Plan</text>
  <text x="174" y="272" font-family="Georgia, serif" font-size="28" fill="#1d2528">Week 1</text>
  <text x="174" y="310" font-family="Georgia, serif" font-size="24" fill="#59676f">Learn what Chat, Cowork,</text>
  <text x="174" y="342" font-family="Georgia, serif" font-size="24" fill="#59676f">and Code are for.</text>
  <text x="174" y="394" font-family="Georgia, serif" font-size="28" fill="#1d2528">Week 2</text>
  <text x="174" y="432" font-family="Georgia, serif" font-size="24" fill="#59676f">Use Claude to solve one</text>
  <text x="174" y="464" font-family="Georgia, serif" font-size="24" fill="#59676f">real-life problem at home.</text>
  <text x="174" y="516" font-family="Georgia, serif" font-size="28" fill="#1d2528">Week 3</text>
  <text x="174" y="554" font-family="Georgia, serif" font-size="24" fill="#59676f">Build one tiny project or</text>
  <text x="174" y="586" font-family="Georgia, serif" font-size="24" fill="#59676f">automation you can keep.</text>
  <rect x="582" y="186" width="458" height="122" rx="22" fill="#12352c"/>
  <text x="612" y="238" font-family="Georgia, serif" font-size="28" fill="#f7fffc">Help me learn AI tools without feeling overwhelmed.</text>
  <text x="612" y="274" font-family="Georgia, serif" font-size="28" fill="#f7fffc">Please keep it simple.</text>
  <rect x="582" y="342" width="458" height="166" rx="22" fill="#f4ecdf" stroke="#e4dac8" stroke-width="2"/>
  <text x="612" y="392" font-family="Georgia, serif" font-size="27" fill="#1d2528">Great. Let’s keep it small and useful.</text>
  <text x="612" y="428" font-family="Georgia, serif" font-size="27" fill="#1d2528">I can turn this into short weekly steps,</text>
  <text x="612" y="464" font-family="Georgia, serif" font-size="27" fill="#1d2528">practice prompts, and one starter project.</text>
  <rect x="582" y="540" width="458" height="128" rx="22" fill="#dff5ec" stroke="#bcdccc" stroke-width="2"/>
  <text x="612" y="592" font-family="Georgia, serif" font-size="27" fill="#114336">Next action</text>
  <text x="612" y="628" font-family="Georgia, serif" font-size="27" fill="#114336">Choose one project you would actually enjoy using.</text>
</svg>
