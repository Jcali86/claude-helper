<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude Helper</title>
    <meta property="og:title" content="Claude Helper">
    <meta property="og:description" content="Calm, clear help for people who are new to Claude. No GitHub, no Terminal — just start.">
    <meta property="og:image" content="https://jcali86.github.io/claude-helper/assets/og-image.png">
    <meta property="og:url" content="https://jcali86.github.io/claude-helper/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Claude Helper">
    <meta name="twitter:description" content="Calm, clear help for people who are new to Claude. No GitHub, no Terminal — just start.">
    <meta name="twitter:image" content="https://jcali86.github.io/claude-helper/assets/og-image.png">
    <link rel="stylesheet" href="assets/site.css">
    <style>
      .os-picker {
        display: flex;
        gap: 20px;
        margin-top: 32px;
        justify-content: center;
      }
      .os-picker a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 200px;
        height: 140px;
        border-radius: var(--radius);
        text-decoration: none;
        font-size: 1.15rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .os-picker a:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      }
      .os-picker .os-mac {
        background: rgba(255, 255, 255, 0.1);
        color: #f0ebe5;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .os-picker .os-windows {
        background: rgba(255, 255, 255, 0.1);
        color: #f0ebe5;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .os-picker .os-icon {
        opacity: 0.9;
      }
      @media (max-width: 500px) {
        .os-picker {
          flex-direction: column;
          align-items: center;
        }
        .os-picker a {
          width: 100%;
          max-width: 280px;
          height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" style="text-align: center; margin-top: 40px;">
        <span class="eyebrow">Beginner-Friendly Claude Help</span>
        <h1>Start here if Claude feels new.</h1>
        <p>
          Pick your computer. Everything after this is written just for you.
        </p>
        <div class="os-picker">
          <a href="mac.html" class="os-mac">
            <svg class="os-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            Mac
          </a>
          <a href="windows.html" class="os-windows">
            <svg class="os-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M3 12V6.75l6-1.32v6.48L3 12zm6.73-.07l8.27-.9V4.6L9.73 5.86v6.07zM18 13.08l-8.27.93v5.94l8.27 1.45v-8.32zM9 13.96l-6 .8v5.37l6 1.07v-7.24z"/></svg>
            Windows
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
